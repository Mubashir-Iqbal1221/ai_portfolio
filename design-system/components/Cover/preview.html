<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mubashir Portfolio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ink); color:var(--bone); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .amber { fill:var(--amber); }
  .sapphire { fill:var(--sapphire); }
  .bone { fill:var(--bone); }
  .mute { fill:var(--mute); }
  .nb { fill:var(--ink); }
  .eb { stroke:var(--ink); stroke-width:1.5; }
  .eg { stroke:var(--mute); stroke-width:1; }
  .words { position:absolute; left:var(--edge-max); bottom:var(--edge-max); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:84px; line-height:.95; letter-spacing:-.01em; color:var(--bone); }
  .tag { margin:10px 0 0 4px; font-size:14px; line-height:20px; color:var(--mute); font-weight:300; }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      amber 200x160 bled off the top-left of the box (the lead accent, largest) · sapphire 280x120 bled off the right edge (the second accent) · bone 160x120 and mute 240x120 bled off the bottom (neutral relief) — about 40% of the cover
  arrangement a staggered stack: amber on the top-left, sapphire stepping down to the right, a two-part strip along the bottom, every side a multiple of edge-max (40px), square corners (radius-none)
  pattern     a literal motif: the knowledge graph the page is built around. 16 circular nodes (radius-round) and 15 links on a 40px lattice, nodes cut out of the blocks in the ground color, three nodes and links standing free on the ground in amber, sapphire and bone
  scales      pitch and sides edge-max (40px); corners radius-none; node radius 6px, half of a 12px dot
-->
<rect class="amber" x="0" y="0" width="200" height="160"/>
<rect class="sapphire" x="200" y="80" width="280" height="120"/>
<rect class="bone" x="40" y="200" width="160" height="120"/>
<rect class="mute" x="240" y="200" width="240" height="120"/>
<line class="eg" x1="240" y1="40" x2="320" y2="40"/>
<line class="eg" x1="320" y1="40" x2="400" y2="40"/>
<line class="eg" x1="400" y1="40" x2="440" y2="20"/>
<line class="eb" x1="40" y1="40" x2="120" y2="80"/>
<line class="eb" x1="120" y1="80" x2="160" y2="120"/>
<line class="eb" x1="160" y1="120" x2="240" y2="120"/>
<line class="eb" x1="240" y1="120" x2="320" y2="160"/>
<line class="eb" x1="320" y1="160" x2="400" y2="120"/>
<line class="eb" x1="400" y1="120" x2="440" y2="160"/>
<line class="eb" x1="320" y1="160" x2="360" y2="280"/>
<line class="eb" x1="80" y1="240" x2="160" y2="260"/>
<line class="eb" x1="280" y1="240" x2="360" y2="280"/>
<line class="eb" x1="360" y1="280" x2="440" y2="240"/>
<line class="eb" x1="240" y1="120" x2="240" y2="40"/>
<line class="eb" x1="400" y1="120" x2="400" y2="40"/>
<circle class="nb" cx="40" cy="40" r="6"/>
<circle class="nb" cx="120" cy="80" r="6"/>
<circle class="nb" cx="160" cy="120" r="6"/>
<circle class="nb" cx="240" cy="120" r="6"/>
<circle class="nb" cx="320" cy="160" r="6"/>
<circle class="nb" cx="400" cy="120" r="6"/>
<circle class="nb" cx="440" cy="160" r="6"/>
<circle class="nb" cx="80" cy="240" r="6"/>
<circle class="nb" cx="160" cy="260" r="6"/>
<circle class="nb" cx="280" cy="240" r="6"/>
<circle class="nb" cx="360" cy="280" r="6"/>
<circle class="nb" cx="440" cy="240" r="6"/>
<circle class="ng amber" cx="240" cy="40" r="6"/>
<circle class="ng sapphire" cx="320" cy="40" r="6"/>
<circle class="ng bone" cx="400" cy="40" r="6"/>
<circle class="ng amber" cx="440" cy="20" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Mubashir<br>Portfolio</h1>
<p class="tag">Systems that reason, built to run.</p>
</div>
</div>
</body>
</html>
